<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍마오의 수필</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #f9f9f9;
      color: #222;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      max-width: 400px;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }
    input, textarea {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
    }
    button {
      padding: 0.75rem;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .info {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 웹사이트</title>
  <link rel="stylesheet" href="styles.css"> <!-- CSS 파일 연결 -->
</head>
<body>
  <!-- 네비게이션 바 -->
  <nav>
    <ul>
      <li><a href="#company">회사 소개</a></li>
      <li><a href="#author">작가 소개</a></li>
      <li><a href="#products">상품 소개</a></li>
    </ul>
  </nav>

  <!-- 회사 소개 섹션 -->
  <section id="company">
    <h1>회사 소개</h1>
    <p>여기에 회사 소개 내용을 적으면 됩니다.</p>
  </section>

  <!-- 작가 소개 섹션 -->
  <section id="author">
    <h1>작가 소개</h1>
    <p>여기에 작가 소개 내용을 적으면 됩니다.</p>
  </section>

  <!-- 상품 소개 섹션 -->
  <section id="products">
    <h1>상품 소개</h1>
    <div class="product">
      <img src="상품이미지URL" alt="상품 이미지">
      <p>상품 설명</p>
      <p>가격: 10,000원</p>
      <button>구매하기</button>
    </div>
  </section>

  <script src="script.js"></script> <!-- JS 파일 연결 -->
</body>
</html>

  <h1>🖋 수필 구매 신청</h1>
  <p>〈아빠를 영웅으로 그리는 이야기〉<br>입금 후 아래 양식을 작성해 주세요.</p>

  <form action="https://formspree.io/f/{your-form-id}" method="POST">
    <input type="text" name="name" placeholder="이름" required>
    <input type="email" name="email" placeholder="이메일" required>
    <input type="text" name="payment" placeholder="입금자명" required>
    <textarea name="message" placeholder="메모 (선택사항)" rows="3"></textarea>
    <button type="submit">제출하기</button>
  </form>

  <div class="info">
    💸 입금 계좌: 카카오뱅크 3333-12-1234567 (홍길동)<br>
    제출 후 1~2일 내로 PDF를 이메일로 보내드립니다.
  </div>
</body>
</html>
