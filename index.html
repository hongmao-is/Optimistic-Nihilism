<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 웹사이트</title>
  <!-- Google Fonts 추가 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* 기본 스타일 설정 */
    body {
      font-family: 'Noto Sans KR', sans-serif; /* 한글 폰트 */
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    header h1 {
      margin: 0;
      font-size: 2.5em;
      font-family: 'Playfair Display', serif; /* 영어 폰트 */
    }

    nav ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      background-color: #444;
      text-align: center;
    }

    nav ul li {
      display: inline;
      margin-right: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 1.2em;
    }

    nav ul li a:hover {
      text-decoration: underline;
    }

    section {
      padding: 50px;
      text-align: center;
    }

    section h2 {
      font-size: 2em;
      color: #333;
      font-family: 'Playfair Display', serif; /* 영어 폰트 */
    }

    .company-info {
      font-size: 0.8em;
      color: #777;
      margin-top: 10px;
    }

    .company-photo {
      width: 70%;
      height: auto;
      margin: 20px 0;
    }

    .product {
      background-color: white;
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px;
      display: inline-block;
      width: 250px;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: auto;
    }

    .product button {
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }

    .product button:hover {
      background-color: #218838;
    }

    /* 구독 폼 스타일 */
    .subscribe-form input, .subscribe-form textarea, .subscribe-form button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      font-size: 1em;
    }

    .subscribe-form button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }

    .subscribe-form button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <h1>나의 웹사이트</h1>
    <p>작가 소개, 상품 판매 사이트입니다.</p>
  </header>

  <!-- 네비게이션 바 -->
  <nav>
    <ul>
      <li><a href="#company">회사</a></li>
      <li><a href="#subscribe">구독</a></li>
    </ul>
  </nav>

  <!-- 회사 소개 섹션 -->
  <section id="company">
    <h2>낙관적 허무주의</h2>
    <div class="company-info">
      홍마오 contact : <span style="font-size: 0.8em;">bewhyeun@naver.com</span>
    </div>
    <img class="company-photo" src="https://via.placeholder.com/800x400" alt="회사 이미지">
  </section>

  <!-- 구독 섹션 -->
  <section id="subscribe">
    <h2>구독 신청</h2>
    <form class="subscribe-form">
      <input type="text" placeholder="이름을 입력하세요" required>
      <input type="email" placeholder="이메일을 입력하세요" required>
      <textarea placeholder="구독에 대한 요청이나 메시지를 적어주세요" rows="4" required></textarea>
      <button type="submit">구독 신청하기</button>
    </form>
  </section>

</body>
</html>
